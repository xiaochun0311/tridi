run:
  name: himo_weak_v1_20261030
  datasets: [himo]
  job: train
  cpu: false
  seed: 42

logging:
  wandb: false

dataloader:
  batch_size: 16
  workers: 0

train:
  max_steps: 5000

optimizer:
  lr: 0.0001
  weight_decay: 0.000001
  kwargs:
    betas: [0.95, 0.999]

himo:
  root: ${env.raw_datasets_folder}/himo/unpacked-20261029/data
  annotations: ./outputs/himo-weak-20261030/stage_weak.json
  prepared_data: ${env.datasets_folder}/himo_weak_v1_20261030.pth
  contact_indices: ${env.datasets_folder}/himo_smplx_indices.npy
  initialization_checkpoint: ${env.assets_folder}/gb_main.pth
  supervision: weak_temporal_v1
  eval_every: 200
  eval_steps: 20
  max_val_samples: 32
  log_every: 50
